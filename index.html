<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七龍珠：激震小隊 (人型角色與近戰版)</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0b0d; color: #fff;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #app { width: 100vw; height: 100vh; position: relative; }
        
        /* 角色選擇畫面 */
        #select-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1c29 0%, #0d1117 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; padding: 20px; box-sizing: border-box;
        }
        #select-screen h1 {
            font-size: 36px; color: #f1c40f; text-shadow: 0 0 10px rgba(241,196,15,0.5); margin-bottom: 20px;
        }
        .char-container {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 900px;
            max-height: 60vh; overflow-y: auto; padding: 10px;
        }
        .char-card {
            background: rgba(255,255,255,0.05); border: 2px solid #333; border-radius: 12px;
            padding: 15px; width: 130px; text-align: center; cursor: pointer;
            transition: all 0.2s; backdrop-filter: blur(5px);
        }
        .char-card:hover { transform: translateY(-5px); border-color: #e67e22; }
        .char-card.selected { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241,196,15,0.4); background: rgba(241,196,15,0.15); }
        .char-avatar { width: 60px; height: 60px; margin: 0 auto 10px; border-radius: 50%; background: #222; border: 2px solid #555; }
        
        .start-btn {
            margin-top: 25px; padding: 12px 40px; font-size: 22px; background: #e74c3c;
            color: #fff; border: none; border-radius: 25px; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 15px rgba(231,76,60,0.4);
        }
        .start-btn:active { transform: scale(0.98); }

        /* 遊戲畫面 */
        #game-screen { display: none; width: 100%; height: 100%; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 15px; left: 15px; right: 15px; pointer-events: none;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .team-score {
            font-size: 18px; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
        }
        #blue-score-box { color: #3498db; }
        #red-score-box { color: #e74c3c; text-align: right; }
        
        /* 手機控制面板 */
        #touch-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            pointer-events: none; z-index: 5; display: flex; justify-content: space-between; align-items: flex-end;
            padding: 20px; box-sizing: border-box;
        }
        #joystick-zone {
            width: 150px; height: 150px; background: rgba(255,255,255,0.08); border-radius: 50%;
            position: relative; pointer-events: auto; border: 2px solid rgba(255,255,255,0.2);
        }
        #joystick-knob {
            width: 55px; height: 55px; background: rgba(241,196,15,0.8); border-radius: 50%;
            position: absolute; top: 47.5px; left: 47.5px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #skill-buttons {
            display: grid; grid-template-columns: 70px 70px; gap: 12px; pointer-events: auto;
        }
        .skill-btn {
            width: 65px; height: 65px; background: rgba(52,152,219,0.8); border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6); color: white; font-weight: bold; font-size: 13px;
            display: flex; justify-content: center; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); padding: 4px; box-sizing: border-box;
        }
        .skill-btn:active { transform: scale(0.92); }
        .skill-btn.cooldown { background: rgba(80,80,80,0.8); color: #aaa; }
        .skill-melee { background: rgba(231,76,60,0.85); border-color: #ff7675; } /* 近戰攻擊特殊按鈕 */
        .skill-transform { background: rgba(241,196,15,0.85); border-color: #ffeaa7; }

        /* 遊戲結束畫面 */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
        }
        #game-over h1 { font-size: 45px; margin-bottom: 20px; }
        #game-over button {
            padding: 12px 35px; font-size: 20px; background: #2ecc71; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        #pc-hint {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 15px; border-radius: 20px; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 選擇畫面 -->
    <div id="select-screen">
        <h1>GEKISHIN SQUADRA - 選擇戰士</h1>
        <div class="char-container" id="char-list"></div>
        <button class="start-btn" onclick="startGame()">開戰 (4v4)</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="team-score" id="blue-score-box">
                藍隊 (我方)<br><span id="blue-score" style="font-size:24px; font-weight:bold;">4</span> 存活
            </div>
            <div class="team-score" id="red-score-box">
                紅隊 (敵方)<br><span id="red-score" style="font-size:24px; font-weight:bold;">4</span> 存活
            </div>
        </div>
        
        <div id="pc-hint">移動: WASD | 近戰: J | 氣功: K | 特殊招: L | 變身: I</div>

        <div id="touch-controls">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div id="skill-buttons">
                <div class="skill-btn skill-melee" id="btn-1" ontouchstart="useSkill(0, event)" onmousedown="useSkill(0, event)">近戰</div>
                <div class="skill-btn" id="btn-2" ontouchstart="useSkill(1, event)" onmousedown="useSkill(1, event)">氣功</div>
                <div class="skill-btn" id="btn-3" ontouchstart="useSkill(2, event)" onmousedown="useSkill(2, event)">絕招</div>
                <div class="skill-btn skill-transform" id="btn-4" ontouchstart="useSkill(3, event)" onmousedown="useSkill(3, event)">變身</div>
            </div>
        </div>

        <div id="game-over">
            <h1 id="result-text">戰鬥結束</h1>
            <button onclick="location.reload()">返回選單</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 遊戲設定與多角色資料庫 (6位經典角色)
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const WORLD_WIDTH = 3000;
    const WORLD_HEIGHT = 3000;
    let camera = { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        camera.width = canvas.width;
        camera.height = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    const CHARACTERS = {
        'goku': {
            name: '孫悟空', hairColor: '#111', skinColor: '#ffdbac', suitColor: '#e67e22', aura: 'rgba(230,126,34,0.3)',
            hp: 550, speed: 5.5, size: 24, hairType: 'spiky',
            skills: [
                { name: '近戰拳腳', cd: 20, type: 'melee', dmg: 35, range: 60 },
                { name: '龜派氣功', cd: 120, type: 'beam', dmg: 90, speed: 22, size: 22, color: '#3498db' },
                { name: '界王拳突擊', cd: 180, type: 'dash_attack', dmg: 70, range: 250 },
                { name: '超級賽亞人', cd: 600, type: 'transform', hairColor: '#f1c40f', aura: 'rgba(241,196,15,0.6)', buff: { speed: 1.4, dmgMult: 1.5 }, duration: 800 }
            ]
        },
        'vegeta': {
            name: '達爾', hairColor: '#111', skinColor: '#ffdbac', suitColor: '#2980b9', aura: 'rgba(41,128,185,0.3)',
            hp: 500, speed: 5.8, size: 22, hairType: 'tall_spiky',
            skills: [
                { name: '連續重拳', cd: 18, type: 'melee', dmg: 30, range: 55 },
                { name: '連續氣功彈', cd: 140, type: 'spread', count: 4, dmg: 22, speed: 14, size: 8, color: '#f1c40f' },
                { name: '終極閃光', cd: 200, type: 'beam', dmg: 110, speed: 25, size: 28, color: '#f39c12' },
                { name: '超級賽亞人', cd: 600, type: 'transform', hairColor: '#f1c40f', aura: 'rgba(241,196,15,0.6)', buff: { speed: 1.3, dmgMult: 1.6 }, duration: 800 }
            ]
        },
        'trunks': {
            name: '特南克斯', hairColor: '#8e44ad', skinColor: '#ffdbac', suitColor: '#34495e', aura: 'rgba(142,68,173,0.3)',
            hp: 480, speed: 6.0, size: 22, hairType: 'bowl_spiky', hasSword: true,
            skills: [
                { name: '劍擊斬切', cd: 15, type: 'melee', dmg: 40, range: 70, isSword: true },
                { name: '閃光彈', cd: 100, type: 'shoot', dmg: 50, speed: 16, size: 12, color: '#f1c40f' },
                { name: '高速斬擊', cd: 160, type: 'dash_attack', dmg: 85, range: 280, isSword: true },
                { name: '超級賽亞人', cd: 600, type: 'transform', hairColor: '#f1c40f', aura: 'rgba(241,196,15,0.6)', buff: { speed: 1.5, dmgMult: 1.4 }, duration: 800 }
            ]
        },
        'frieza': {
            name: '弗利沙', hairColor: '#8e44ad', skinColor: '#ecf0f1', suitColor: '#8e44ad', aura: 'rgba(142,68,173,0.3)',
            hp: 460, speed: 6.2, size: 20, hairType: 'smooth', hasTail: true,
            skills: [
                { name: '尾巴橫掃', cd: 20, type: 'melee', dmg: 32, range: 65 },
                { name: '死亡光束', cd: 40, type: 'shoot', dmg: 35, speed: 26, size: 6, color: '#8e44ad' },
                { name: '死亡球', cd: 220, type: 'shoot', dmg: 130, speed: 7, size: 40, color: '#9b59b6', pierce: true },
                { name: '黃金弗利沙', cd: 600, type: 'transform', skinColor: '#f1c40f', suitColor: '#d4af37', aura: 'rgba(241,196,15,0.8)', buff: { speed: 1.4, dmgMult: 1.6 }, duration: 800 }
            ]
        },
        'piccolo': {
            name: '比克', hairColor: '#27ae60', skinColor: '#27ae60', suitColor: '#8e44ad', aura: 'rgba(39,174,96,0.3)',
            hp: 650, speed: 4.8, size: 26, hairType: 'turban',
            skills: [
                { name: '魔神連拳', cd: 22, type: 'melee', dmg: 38, range: 60 },
                { name: '魔閃光', cd: 110, type: 'shoot', dmg: 55, speed: 15, size: 14, color: '#f1c40f' },
                { name: '魔貫光殺砲', cd: 190, type: 'beam', dmg: 105, speed: 30, size: 16, color: '#f1c40f', pierce: true },
                { name: '巨大化', cd: 600, type: 'transform', aura: 'rgba(39,174,96,0.7)', buff: { sizeMult: 1.8, hpHeal: 150, dmgMult: 1.7 }, duration: 700 }
            ]
        },
        'buu': {
            name: '魔人普烏', hairColor: '#ff7675', skinColor: '#ff7675', suitColor: '#fdcb6e', aura: 'rgba(255,118,117,0.3)',
            hp: 750, speed: 4.2, size: 28, hairType: 'antenna',
            skills: [
                { name: '肉搏重擊', cd: 25, type: 'melee', dmg: 45, range: 60 },
                { name: '變糖果光束', cd: 150, type: 'shoot', dmg: 60, speed: 12, size: 18, color: '#e84393' },
                { name: '衝擊波爆裂', cd: 200, type: 'aoe', dmg: 80, range: 180, color: '#fd79a8' },
                { name: '吸收進化', cd: 600, type: 'transform', aura: 'rgba(232,67,147,0.7)', buff: { hpHeal: 250, speed: 1.3, dmgMult: 1.4 }, duration: 800 }
            ]
        }
    };

    let selectedCharId = 'goku';

    function initSelectScreen() {
        const container = document.getElementById('char-list');
        container.innerHTML = '';
        for (const [id, char] of Object.entries(CHARACTERS)) {
            const card = document.createElement('div');
            card.className = `char-card ${id === selectedCharId ? 'selected' : ''}`;
            card.onclick = () => selectChar(id);
            card.innerHTML = `
                <div class="char-avatar" style="background:${char.suitColor}; border-color:${char.hairColor};"></div>
                <h3 style="margin:5px 0; color:#fff;">${char.name}</h3>
                <div style="font-size:11px; color:#bdc3c7;">
                    ${char.skills.map(s => s.name).join('<br>')}
                </div>
            `;
            container.appendChild(card);
        }
    }

    function selectChar(id) {
        selectedCharId = id;
        initSelectScreen();
    }
    initSelectScreen();

    // ==========================================
    // 遊戲核心邏輯
    // ==========================================
    let player = null;
    let entities = [];
    let projectiles = [];
    let effects = [];
    let isGameOver = false;

    // 控制項
    const keys = { w: false, a: false, s: false, d: false };
    const touchInput = { vx: 0, vy: 0 };
    window.addEventListener('keydown', e => { 
        if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
        if(e.key === 'j') triggerSkill(0);
        if(e.key === 'k') triggerSkill(1);
        if(e.key === 'l') triggerSkill(2);
        if(e.key === 'i') triggerSkill(3);
    });
    window.addEventListener('keyup', e => { 
        if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; 
    });

    // 搖桿
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let joyCenter = {x:0, y:0}, joyActive = false, joyId = null;

    joystickZone.addEventListener('touchstart', e => {
        e.preventDefault();
        const rect = joystickZone.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        joyId = e.changedTouches[0].identifier;
        joyActive = true;
        updateJoy(e.changedTouches[0]);
    }, {passive:false});
    joystickZone.addEventListener('touchmove', e => {
        e.preventDefault();
        if(!joyActive) return;
        for(let t of e.changedTouches) {
            if(t.identifier === joyId) { updateJoy(t); break; }
        }
    }, {passive:false});
    const resetJoy = (e) => { e.preventDefault(); joyActive=false; joyId=null; touchInput.vx=0; touchInput.vy=0; joystickKnob.style.transform='translate(0,0)'; };
    joystickZone.addEventListener('touchend', resetJoy);
    joystickZone.addEventListener('touchcancel', resetJoy);

    function updateJoy(t) {
        const dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
        const dist = Math.min(Math.hypot(dx, dy), 45);
        const angle = Math.atan2(dy, dx);
        joystickKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        touchInput.vx = Math.cos(angle) * (dist/45);
        touchInput.vy = Math.sin(angle) * (dist/45);
    }

    function useSkill(index, e) {
        if(e) e.preventDefault();
        triggerSkill(index);
    }
    function triggerSkill(index) {
        if(player && !isGameOver) player.castSkill(index);
    }

    // 繪製人型角色函數 (擺脫簡單圓圈)
    function drawHumanoid(ctx, x, y, angle, charData, state) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        const size = state.size || charData.size;
        const isAttacking = state.meleeAnimTimer > 0;
        const isSword = state.isSwordAnim;

        // 腳步與身體
        ctx.fillStyle = state.suitColor || charData.suitColor;
        // 軀幹
        ctx.fillRect(-size*0.4, -size*0.5, size*0.8, size);

        // 雙手臂 (近戰時手揮出)
        ctx.fillStyle = state.skinColor || charData.skinColor;
        if(isAttacking) {
            // 右手前揮/揮劍
            ctx.fillRect(0, -size*0.6, size*1.2, size*0.3);
            if(isSword) {
                // 劍身
                ctx.fillStyle = '#ecf0f1';
                ctx.fillRect(size*0.8, -size*0.8, size*1.5, size*0.25);
            }
        } else {
            ctx.fillRect(-size*0.5, -size*0.6, size*0.3, size*0.8);
            ctx.fillRect(-size*0.5, size*0.2, size*0.3, size*0.8);
        }

        // 頭部 (圓形底)
        ctx.beginPath();
        ctx.arc(0, 0, size*0.45, 0, Math.PI*2);
        ctx.fillStyle = state.skinColor || charData.skinColor;
        ctx.fill();

        // 髮型/頭飾劃分 (指向前方)
        ctx.fillStyle = state.hairColor || charData.hairColor;
        const hType = charData.hairType;
        if (hType === 'spiky') { // 悟空怒髮
            ctx.beginPath();
            ctx.moveTo(-size*0.4, -size*0.4);
            ctx.lineTo(-size*0.8, -size*0.8);
            ctx.lineTo(-size*0.2, -size*0.5);
            ctx.lineTo(-size*0.6, 0);
            ctx.lineTo(-size*0.2, -size*0.2);
            ctx.fill();
        } else if (hType === 'tall_spiky') { // 達爾朝上刺髮
            ctx.beginPath();
            ctx.moveTo(-size*0.3, -size*0.4);
            ctx.lineTo(-size*0.9, -size*0.3);
            ctx.lineTo(-size*0.3, 0);
            ctx.lineTo(-size*0.9, size*0.3);
            ctx.lineTo(-size*0.3, size*0.4);
            ctx.fill();
        } else if (hType === 'turban') { // 比克包頭
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-size*0.4, -size*0.4, size*0.5, size*0.8);
        } else if (hType === 'antenna') { // 普烏觸角
            ctx.beginPath();
            ctx.arc(-size*0.5, 0, size*0.2, 0, Math.PI*2);
            ctx.fill();
        }

        // 眼睛方向提示
        ctx.fillStyle = '#000';
        ctx.fillRect(size*0.2, -size*0.15, size*0.1, size*0.1);
        ctx.fillRect(size*0.2, size*0.05, size*0.1, size*0.1);

        ctx.restore();
    }

    // 角色實體
    class Character {
        constructor(x, y, team, charId, isPlayer = false) {
            this.x = x; this.y = y; this.team = team; this.isPlayer = isPlayer;
            this.charId = charId;
            const baseData = CHARACTERS[charId];
            this.name = baseData.name;
            this.charData = baseData;
            
            this.maxHp = baseData.hp; this.hp = this.maxHp;
            this.speed = baseData.speed;
            this.size = baseData.size;
            this.skills = JSON.parse(JSON.stringify(baseData.skills));
            this.cooldowns = [0, 0, 0, 0];
            
            this.angle = 0; // 面向角度
            this.dmgMult = 1;
            this.transformTimer = 0;
            
            // 動畫狀態
            this.state = {
                hairColor: baseData.hairColor,
                skinColor: baseData.skinColor,
                suitColor: baseData.suitColor,
                aura: baseData.aura,
                size: baseData.size,
                meleeAnimTimer: 0,
                isSwordAnim: false
            };
        }

        draw() {
            if(this.hp <= 0) return;
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;
            
            if(screenX < -100 || screenX > camera.width+100 || screenY < -100 || screenY > camera.height+100) return;

            // 氣場繪製
            ctx.beginPath();
            ctx.arc(screenX, screenY, this.state.size + 12 + Math.sin(Date.now()/80)*4, 0, Math.PI*2);
            ctx.fillStyle = this.state.aura;
            ctx.fill();

            // 繪製人型本體
            drawHumanoid(ctx, screenX, screenY, this.angle, this.charData, this.state);

            // 名字與血條
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(this.name, screenX, screenY - this.state.size - 22);
            
            const hpW = 48;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(screenX - hpW/2, screenY - this.state.size - 16, hpW, 6);
            ctx.fillStyle = this.team === 'blue' ? '#2ecc71' : '#ff4757';
            ctx.fillRect(screenX - hpW/2, screenY - this.state.size - 16, hpW * Math.max(0, this.hp/this.maxHp), 6);
        }

        update() {
            if(this.hp <= 0) return;
            
            for(let i=0; i<4; i++) if(this.cooldowns[i]>0) this.cooldowns[i]--;
            if(this.state.meleeAnimTimer > 0) this.state.meleeAnimTimer--;

            if(this.transformTimer > 0) {
                this.transformTimer--;
                if(this.transformTimer === 0) this.resetTransform();
            }

            if(this.isPlayer) {
                // UI 技能冷卻更新
                for(let i=0; i<4; i++) {
                    const btn = document.getElementById(`btn-${i+1}`);
                    if(this.cooldowns[i] > 0) {
                        btn.classList.add('cooldown');
                        btn.innerText = Math.ceil(this.cooldowns[i]/60);
                    } else {
                        btn.classList.remove('cooldown');
                        btn.innerText = this.skills[i].name;
                    }
                }

                // 移動
                let dx = 0, dy = 0;
                if(Math.abs(touchInput.vx)>0.1 || Math.abs(touchInput.vy)>0.1) {
                    dx = touchInput.vx * this.speed; dy = touchInput.vy * this.speed;
                } else {
                    if(keys.a) dx = -this.speed; if(keys.d) dx = this.speed;
                    if(keys.w) dy = -this.speed; if(keys.s) dy = this.speed;
                }
                this.x += dx; this.y += dy;
                
                if(dx !== 0 || dy !== 0) {
                    this.angle = Math.atan2(dy, dx);
                }
            } else {
                this.updateAI();
            }

            this.x = Math.max(this.state.size, Math.min(WORLD_WIDTH - this.state.size, this.x));
            this.y = Math.max(this.state.size, Math.min(WORLD_HEIGHT - this.state.size, this.y));
        }

        updateAI() {
            let minDist = Infinity, target = null;
            entities.forEach(e => {
                if(e.hp>0 && e.team !== this.team) {
                    const d = Math.hypot(e.x-this.x, e.y-this.y);
                    if(d < minDist) { minDist = d; target = e; }
                }
            });

            if(target) {
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                this.angle = Math.atan2(dy, dx);

                // 近戰AI會主動貼近，遠程AI會保持距離
                const preferDist = this.skills[0].type === 'melee' && Math.random() < 0.6 ? 40 : 220;

                if(minDist > preferDist + 20) {
                    this.x += Math.cos(this.angle) * this.speed * 0.85;
                    this.y += Math.sin(this.angle) * this.speed * 0.85;
                } else if(minDist < preferDist - 20) {
                    this.x -= Math.cos(this.angle) * this.speed * 0.85;
                    this.y -= Math.sin(this.angle) * this.speed * 0.85;
                }

                if(Math.random() < 0.03) {
                    const sIdx = Math.floor(Math.random()*4);
                    this.castSkill(sIdx, target.x, target.y);
                }
            }
        }

        castSkill(index, tx, ty) {
            if(this.cooldowns[index] > 0) return;
            const skill = this.skills[index];
            this.cooldowns[index] = skill.cd;

            let targetX = tx, targetY = ty;
            if(!targetX && this.isPlayer) {
                let nearest = null, md = Infinity;
                entities.forEach(e => {
                    if(e.hp>0 && e.team !== this.team) {
                        const d = Math.hypot(e.x-this.x, e.y-this.y);
                        if(d < md) { md = d; nearest = e; }
                    }
                });
                if(nearest) { targetX = nearest.x; targetY = nearest.y; }
                else { targetX = this.x + Math.cos(this.angle)*100; targetY = this.y + Math.sin(this.angle)*100; }
            }

            if(targetX) this.angle = Math.atan2(targetY - this.y, targetX - this.x);

            // 近戰技能處理
            if(skill.type === 'melee') {
                this.state.meleeAnimTimer = 15;
                this.state.isSwordAnim = !!skill.isSword;
                
                // 產生前方扇形/打擊判定
                const hitX = this.x + Math.cos(this.angle) * skill.range * 0.6;
                const hitY = this.y + Math.sin(this.angle) * skill.range * 0.6;
                effects.push(new VisualEffect(hitX, hitY, skill.isSword ? '#ecf0f1' : '#f1c40f', skill.range, true));

                entities.forEach(e => {
                    if(e.hp>0 && e.team !== this.team) {
                        const dist = Math.hypot(e.x - hitX, e.y - hitY);
                        if(dist < skill.range + e.state.size) {
                            e.takeDamage(skill.dmg * this.dmgMult);
                            // 擊退效果
                            e.x += Math.cos(this.angle) * 30;
                            e.y += Math.sin(this.angle) * 30;
                        }
                    }
                });
            } else if(skill.type === 'dash_attack') {
                // 近戰突進
                this.x += Math.cos(this.angle) * skill.range;
                this.y += Math.sin(this.angle) * skill.range;
                this.state.meleeAnimTimer = 20;
                effects.push(new VisualEffect(this.x, this.y, '#e74c3c', 60));
                
                entities.forEach(e => {
                    if(e.hp>0 && e.team !== this.team && Math.hypot(e.x-this.x, e.y-this.y) < 80) {
                        e.takeDamage(skill.dmg * this.dmgMult);
                    }
                });
            } else if(skill.type === 'shoot' || skill.type === 'beam') {
                projectiles.push(new Projectile(this.x, this.y, this.angle, this.team, skill.dmg*this.dmgMult, skill.size, skill.speed, skill.color, skill.pierce));
            } else if(skill.type === 'spread') {
                for(let i=0; i<skill.count; i++) {
                    const sprAngle = this.angle + (i - (skill.count-1)/2) * 0.25;
                    projectiles.push(new Projectile(this.x, this.y, sprAngle, this.team, skill.dmg*this.dmgMult, skill.size, skill.speed, skill.color));
                }
            } else if(skill.type === 'aoe') {
                effects.push(new VisualEffect(this.x, this.y, skill.color, skill.range, true));
                entities.forEach(e => {
                    if(e.hp>0 && e.team !== this.team && Math.hypot(e.x-this.x, e.y-this.y) <= skill.range) {
                        e.takeDamage(skill.dmg * this.dmgMult);
                    }
                });
            } else if(skill.type === 'transform') {
                this.transformTimer = skill.duration;
                if(skill.hairColor) this.state.hairColor = skill.hairColor;
                if(skill.skinColor) this.state.skinColor = skill.skinColor;
                if(skill.suitColor) this.state.suitColor = skill.suitColor;
                if(skill.aura) this.state.aura = skill.aura;
                if(skill.buff.speed) this.speed = this.charData.speed * skill.buff.speed;
                if(skill.buff.dmgMult) this.dmgMult = skill.buff.dmgMult;
                if(skill.buff.sizeMult) this.state.size = this.charData.size * skill.buff.sizeMult;
                if(skill.buff.hpHeal) this.hp = Math.min(this.maxHp, this.hp + skill.buff.hpHeal);
                effects.push(new VisualEffect(this.x, this.y, '#f1c40f', 120));
            }
        }

        takeDamage(dmg) {
            this.hp -= dmg;
        }

        resetTransform() {
            this.state.hairColor = this.charData.hairColor;
            this.state.skinColor = this.charData.skinColor;
            this.state.suitColor = this.charData.suitColor;
            this.state.aura = this.charData.aura;
            this.state.size = this.charData.size;
            this.speed = this.charData.speed;
            this.dmgMult = 1;
        }
    }

    class Projectile {
        constructor(x, y, angle, team, damage, radius, speed, color, pierce = false) {
            this.x = x; this.y = y; this.vx = Math.cos(angle)*speed; this.vy = Math.sin(angle)*speed;
            this.team = team; this.damage = damage; this.radius = radius;
            this.color = color; this.pierce = pierce; this.active = true;
            this.hitTargets = new Set();
        }
        draw() {
            if(!this.active) return;
            const sx = this.x - camera.x, sy = this.y - camera.y;
            if(sx < -50 || sx > camera.width+50 || sy < -50 || sy > camera.height+50) return;
            
            ctx.beginPath(); ctx.arc(sx, sy, this.radius, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.fill();
            ctx.beginPath(); ctx.arc(sx, sy, this.radius+4, 0, Math.PI*2);
            ctx.fillStyle = this.color; ctx.globalAlpha = 0.6; ctx.fill(); ctx.globalAlpha = 1.0;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if(this.x<0 || this.x>WORLD_WIDTH || this.y<0 || this.y>WORLD_HEIGHT) this.active = false;
        }
    }

    class VisualEffect {
        constructor(x, y, color, maxRadius, isSlash=false) {
            this.x = x; this.y = y; this.color = color; this.maxRadius = maxRadius;
            this.radius = 5; this.active = true; this.alpha = 1; this.isSlash = isSlash;
        }
        draw() {
            if(!this.active) return;
            const sx = this.x - camera.x, sy = this.y - camera.y;
            ctx.beginPath();
            ctx.arc(sx, sy, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color; ctx.globalAlpha = this.alpha; ctx.fill(); ctx.globalAlpha = 1.0;
        }
        update() {
            this.radius += (this.maxRadius - this.radius) * 0.25;
            this.alpha -= 0.08;
            if(this.alpha <= 0) this.active = false;
        }
    }

    // 主流程
    function startGame() {
        document.getElementById('select-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        resize();

        entities = []; projectiles = []; effects = []; isGameOver = false;
        document.getElementById('game-over').style.display = 'none';

        const keysList = Object.keys(CHARACTERS);

        // 藍隊 (我方 1 玩家 + 3 AI)
        player = new Character(WORLD_WIDTH/2 - 250, WORLD_HEIGHT/2, 'blue', selectedCharId, true);
        entities.push(player);
        for(let i=0; i<3; i++) {
            let rId = keysList[Math.floor(Math.random()*keysList.length)];
            entities.push(new Character(WORLD_WIDTH/2 - 350, WORLD_HEIGHT/2 + (i-1)*180, 'blue', rId, false));
        }

        // 紅隊 (敵方 4 AI)
        for(let i=0; i<4; i++) {
            let rId = keysList[Math.floor(Math.random()*keysList.length)];
            entities.push(new Character(WORLD_WIDTH/2 + 350, WORLD_HEIGHT/2 + (i-1.5)*180, 'red', rId, false));
        }

        gameLoop();
    }

    function checkCollisions() {
        projectiles.forEach(p => {
            if(!p.active) return;
            entities.forEach(e => {
                if(e.hp>0 && e.team !== p.team) {
                    if(p.hitTargets.has(e)) return;
                    const dist = Math.hypot(e.x - p.x, e.y - p.y);
                    if(dist < e.state.size + p.radius) {
                        e.takeDamage(p.damage);
                        effects.push(new VisualEffect(p.x, p.y, '#fff', 20));
                        if(p.pierce) p.hitTargets.add(e);
                        else p.active = false;
                    }
                }
            });
        });
    }

    function drawMap() {
        ctx.fillStyle = '#27293d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#32354a';
        ctx.lineWidth = 2;
        const gSize = 120;
        const offsetX = -(camera.x % gSize);
        const offsetY = -(camera.y % gSize);
        
        for(let x = offsetX; x < canvas.width; x += gSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y = offsetY; y < canvas.height; y += gSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 邊界
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 8;
        ctx.strokeRect(-camera.x, -camera.y, WORLD_WIDTH, WORLD_HEIGHT);
    }

    function gameLoop() {
        if(isGameOver) return;
        
        if(player) {
            camera.x = player.x - camera.width/2;
            camera.y = player.y - camera.height/2;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMap();

        let bAlive = 0, rAlive = 0;
        entities.sort((a,b) => a.y - b.y);

        entities.forEach(e => {
            e.update();
            e.draw();
            if(e.hp>0) { e.team==='blue' ? bAlive++ : rAlive++; }
        });

        document.getElementById('blue-score').innerText = bAlive;
        document.getElementById('red-score').innerText = rAlive;

        projectiles.forEach(p => { p.update(); p.draw(); });
        checkCollisions();
        projectiles = projectiles.filter(p => p.active);

        effects.forEach(ef => { ef.update(); ef.draw(); });
        effects = effects.filter(ef => ef.active);

        if(bAlive === 0 || rAlive === 0) {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'flex';
            const rt = document.getElementById('result-text');
            if(bAlive > 0) { rt.innerText = 'VICTORY！'; rt.style.color = '#3498db'; }
            else { rt.innerText = 'DEFEAT...'; rt.style.color = '#e74c3c'; }
        }

        if(!isGameOver) requestAnimationFrame(gameLoop);
    }
</script>
