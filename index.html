<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>龍珠小隊戰場 IV</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101b29;color:#fff3d4;
 font:15px system-ui
}
canvas#field{
 position:fixed;inset:0;width:100%;height:100%;
 touch-action:none
}
button,select{
 font:inherit;color:inherit;background:#223349;
 border:1px solid #697b8d;border-radius:8px;
 padding:8px;touch-action:none
}
button{
 cursor:pointer;user-select:none;
 -webkit-user-select:none
}
.sheet{
 position:fixed;inset:0;overflow:auto;
 background:linear-gradient(135deg,#14243a,#0b131f);
 padding:clamp(14px,4vw,50px)
}
main{max-width:980px;margin:auto}
h1{font-size:clamp(26px,5vw,50px);margin:.12em 0}
small{color:#ffc660;letter-spacing:.14em}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
 gap:7px
}
.card{
 display:grid;justify-items:center;
 background:linear-gradient(150deg,#314458,#192639);
 padding:4px
}
.card.sel{
 border:2px solid #ffc660;background:#51412c
}
.card svg{height:92px}
.card span{font-size:12px;color:#d4dfeb;min-height:32px}
.gold{background:#ffbd56;color:#241b0f;font-weight:bold}
.launch{
 position:sticky;bottom:0;background:#152439;
 padding:9px;border-radius:9px;margin-top:12px
}
#bar,#pad,#acts{position:fixed}
#bar{
 top:6px;left:8px;background:#112034e8;
 padding:5px;border-radius:8px;font-size:12px;
 max-width:calc(100% - 190px);line-height:1.65
}
#pad{
 bottom:16px;left:18px;width:100px;height:100px;
 border:2px solid #a4c3cf80;border-radius:50%;
 background:#15273b88;touch-action:none;
 display:grid;place-items:center
}
#nub{
 background:#cbe5ed99;width:38px;height:38px;
 border-radius:50%;pointer-events:none
}
#acts{
 max-width:300px;bottom:12px;right:10px;
 display:grid;grid-template-columns:repeat(3,minmax(45px,1fr));
 gap:4px
}
#acts button{
 font-size:12px;min-height:43px;background:#192e46ee
}
#acts button.down{background:#866022}
#feed{
 position:fixed;top:105px;left:10px;
 background:#112034d9;padding:7px;border-radius:8px;
 max-width:65%;pointer-events:none;font-size:12px
}
[hidden]{display:none!important}
p{line-height:1.6}
@media(max-width:600px){
 #bar{max-width:65%;font-size:10px}
 #acts{max-width:210px}
 #acts button{font-size:10px;padding:6px}
 #feed{top:120px;font-size:10px}
 .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<canvas id="field"></canvas>

<div id="ui" hidden>
 <div id="bar">
  <span id="hud"></span>
  <button id="pause">暫停</button>
  <button id="back">選角</button>
 </div>
 <div id="feed"></div>
 <div id="pad"><i id="nub"></i></div>
 <div id="acts"></div>
</div>

<section id="menu" class="sheet">
<main>
 <small>英雄圖鑑　／　VOL. 04</small>
 <h1>龍珠小隊戰場</h1>
 <p>
  4 對 4・全王護送戰。上下路全王每 50 秒交換攻守；
  全王到場才能攻擊破壞神。
  突破任一路兩位破壞神，再擊破龍珠！
 </p>
 <p>
  <input id="search" placeholder="搜尋角色…"
   style="padding:10px;width:100%;max-width:400px">
 </p>
 <div id="cards" class="grid"></div>
 <div class="launch">
  <b id="detail"></b>
  <select id="diff">
   <option value=".8">練習</option>
   <option selected value="1">普通</option>
   <option value="1.2">困難</option>
  </select>
  <button class="gold" id="start">出戰 →</button>
 </div>
 <p>
  WASD／方向鍵移動，J 長按普攻。
  Q／E／R 為技能1／2／3，T 大招，F 變身，空白鍵衝刺。
  普攻類型每角固定，拳腳不會自動變氣彈。<br>
  每親手擊倒兩隻小怪升一級：
  Lv.2／3／4 解鎖技能，Lv.5 大招，Lv.7 變身。
  之後逐級強化技能，最高 Lv.12。<br>
  P 暫停；中央牆不可穿越，氣功也會被牆擋住。
  數值與技能效果為自製設計，非官方版本。
 </p>
</main>
</section>

/* ================= 中央牆與路徑 ================= */

function inside(x,y,r=0){
 return x>wall.x-r&&x<wall.x+wall.w+r&&
  y>wall.y-r&&y<wall.y+wall.h+r;
}

// 線段取樣，防止移動、衝刺及瞬移穿牆。
function clear(a,b,r=0){
 let n=Math.ceil(dist(a,b)/12);

 for(let j=0;j<=n;j++){
  let t=n?j/n:0;
  if(inside(
   a.x+(b.x-a.x)*t,
   a.y+(b.y-a.y)*t,
   r
  ))return false;
 }
 return true;
}

function move(u,dx,dy){
 let n=Math.ceil(Math.hypot(dx,dy)/12)||1;

 for(let j=0;j<n;j++){
  let x=clamp(u.x+dx/n,35,W-35);
  let y=clamp(u.y+dy/n,35,H-35);

  if(!inside(x,u.y,26))u.x=x;
  if(!inside(u.x,y,26))u.y=y;
 }
}

// 可見角點最短路徑，AI 可以繞過中央牆。
function waypoint(u,target){
 if(clear(u,target,25))return target;

 let r=55;
 let a=[
  u,target,
  {x:wall.x-r,y:wall.y-r},
  {x:wall.x+wall.w+r,y:wall.y-r},
  {x:wall.x-r,y:wall.y+wall.h+r},
  {x:wall.x+wall.w+r,y:wall.y+wall.h+r}
 ];

 let d=a.map(()=>Infinity);
 let prev=[];
 let done=new Set();
 d[0]=0;

 for(let n=0;n<a.length;n++){
  let k=-1;

  for(let j=0;j<a.length;j++){
   if(!done.has(j)&&(k<0||d[j]<d[k]))k=j;
  }

  if(k<0||!isFinite(d[k]))break;
  done.add(k);

  for(let j=0;j<a.length;j++){
   if(
    !done.has(j)&&clear(a[k],a[j],25)&&
    d[j]>d[k]+dist(a[k],a[j])
   ){
    d[j]=d[k]+dist(a[k],a[j]);
    prev[j]=k;
   }
  }
 }

 let k=1;
 if(prev[k]===undefined)return u;
 while(prev[k]!==0)k=prev[k];
 return a[k];
}

/* ================= 目標、等級、傷害 ================= */

const alive=o=>o.hp>0;

const open=team=>[0,1].some(l=>
 !gods.some(b=>b.team===team&&b.lane===l&&alive(b))
);

function front(team,lane){
 return gods
  .filter(b=>b.team===team&&b.lane===lane&&alive(b))
  .sort((a,b)=>a.depth-b.depth)[0];
}

function suppressed(o){
 let q=zenos[o.lane];
 return q.team!==o.team&&dist(q,o)<185;
}

function valid(o){
 return alive(o)&&(
  o.kind==="god"?
   front(o.team,o.lane)===o&&suppressed(o):
  o.kind==="ball"?
   open(o.team):
   true
 );
}

const enemies=u=>
 [...units,...mobs,...gods,...balls].filter(o=>
  o!==u&&o.team!==u.team&&valid(o)
 );

function nearest(u,r){
 return enemies(u)
  .filter(o=>dist(u,o)<r&&clear(u,o))
  .sort((a,b)=>dist(u,a)-dist(u,b))[0];
}

function level(u){
 u.kills++;
 let next=Math.min(12,1+Math.floor(u.kills/2));

 if(next<=u.lv)return;

 u.lv=next;
 u.max+=100;
 u.hp=Math.min(u.max,u.hp+220);
 u.power+=5;

 if(u===me){
  say(
   "Lv."+u.lv+"！"+
   (u.lv<5?"解鎖技能 "+(u.lv-1):
    u.lv===5?"解鎖大招":
    u.lv===7?"技能強化＋開放變身":
    "獲得技能強化")
  );
 }
}

function hit(u,o,p){
 if(
  state!=="play"||u.team===o.team||
  !valid(o)||o.inv>0
 )return 0;

 let n=Math.min(
  o.hp,
  Math.round(p*(o.shield>0?.45:1))
 );
 o.hp-=n;

 if(o.hp===0){
  if(o.kind==="mob"){
   o.dead=18;
   if(u.kind==="hero")level(u);
  }else if(o.kind==="hero"){
   o.dead=7+o.lv*.6;
   score[1-o.team]++;
   if(u.kind==="hero")u.ko++;
  }else if(o.kind==="god"){
   say(
    (o.team?"敵方":"我方")+
    (o.lane?"下路":"上路")+
    "破壞神被擊敗！"
   );
  }else if(o.kind==="ball"){
   state=u.team?"lose":"win";
   reset();
  }
 }
 return n;
}

const ring=(x,y,r,c)=>fx.push({

});

function fire(
 u,a,p,r=9,c="#9ce7ff",
 speed=850,range=650,pierce=false
){

/* ================= 普攻、技能、大招 ================= */

function cast(u,k){
 if(
  state!=="play"||!alive(u)||u.stun>0||
  u.lv<unlock[k]||u.cd[k]>0||u.ki<costs[k]
 )return;

 let range=k===0?(ranged(u.id)?600:115):750;
 let o=k>=5?null:nearest(u,range);

 if(o)u.a=Math.atan2(o.y-u.y,o.x-u.x);

 u.cd[k]=cool[k];
 u.ki-=costs[k];

 let p=u.power*(u.form>0?1.4:1);

 if(k>=1&&k<=4){
  p*=1+.16*Math.max(
   0,
   Math.floor((u.lv-6-(k-1))/4)+1
  );
 }

 // 唯一普攻：氣彈或拳腳。
 if(k===0){
  u.pose=.18;

  if(ranged(u.id)){
   fire(u,u.a,p,9,"#ffe19a",850,610);
  }else{
   ring(
    u.x+Math.cos(u.a)*55,
    u.y+Math.sin(u.a)*55,
    40,"#ffe7af"
   );
   if(o)hit(u,o,p*1.8);
  }
  return;
 }

 // Lv.7 變身。
 if(k===5){
  u.form=15;
  ring(u.x,u.y,105,"#ffe081");
  return;
 }

 // 衝刺也會受中央牆阻擋。
 if(k===6){
  move(
   u,
   Math.cos(u.a)*235,
   Math.sin(u.a)*235
  );
  u.inv=.25;
  return;
 }

 let kind=behavior[base(u.id)][k-1];
 let ult=k===4;

 function area(x,y,r,n,st=0){
  ring(x,y,r,"#e3b7ff");
  let total=0;

  for(let v of enemies(u)){
   if(dist({x,y},v)<r&&clear({x,y},v)){
    let a=hit(u,v,n);
    total+=a;

    if(a&&["hero","mob"].includes(v.kind)){
     v.stun=st;
    }
   }
  }
  return total;
 }

 if(kind==="guard"){
  u.shield=5;
  ring(u.x,u.y,80,"#96d5ff");
 }

 if(kind==="heal"){
  for(let v of units){
   if(
    v.team===u.team&&alive(v)&&
    dist(u,v)<280&&clear(u,v)
   ){
    v.hp=Math.min(v.max,v.hp+300+u.lv*20);
   }
  }
  ring(u.x,u.y,280,"#a1ffc0");
 }

 if(kind==="rush"){
  if(o){
   let d=dist(u,o);
   move(
    u,
    Math.cos(u.a)*Math.max(0,d-65),
    Math.sin(u.a)*Math.max(0,d-65)
   );

   if(dist(u,o)<120&&clear(u,o)){
    hit(u,o,p*3.5);
   }
  }
  u.pose=.3;
  ring(u.x,u.y,85,"#fff0d0");
 }

 if(["spin","stun","drain","nova","freeze"].includes(kind)){
  let sum=area(
   u.x,u.y,
   ult?370:250,
   p*(ult?5:kind==="stun"?1:3),
   ["stun","freeze"].includes(kind)?2:0
  );

  if(kind==="drain"){
   u.hp=Math.min(u.max,u.hp+sum*.6);
  }
 }

 if(kind==="beam"){
  fire(
   u,u.a,p*(ult?7:2.6),
   ult?25:14,"#b6dcff",
   1000,850,ult
  );
 }

 if(kind==="fan"||kind==="disc"){
  for(let j=-1;j<=1;j++){
   fire(
    u,u.a+j*.16,p*(ult?3.5:1.6),
    kind==="disc"?16:9,
    "#ffe48a",850,760,
    kind==="disc"
   );
  }
 }

 if(kind==="bomb"){
  let x=o?o.x:u.x+430*Math.cos(u.a);
  let y=o?o.y:u.y+430*Math.sin(u.a);

  if(clear(u,{x,y})){
   fx.push({
    x,y,r:ult?190:130,c:"#94e1ff",
    life:.8,bomb:true,u,p:p*(ult?7:2.8)
   });
  }
 }
}

/* ================= 遊戲更新 ================= */

function step(dt){
 time+=dt;

 // 每50秒交換上下路攻守，全王實際步行到下一位破壞神。
 for(let q of zenos){
  let team=(Math.floor(time/50)+q.lane)%2;

  if(team!==q.team){
   q.team=team;
   say(
    (q.lane?"下路":"上路")+
    "攻守交換！"+(team?"紅隊":"藍隊")+"進攻。"
   );
  }

  let target=front(1-q.team,q.lane)||{
   x:home(1-q.team),y:LY[q.lane]
  };
  let tx=target.x;

  q.x+=Math.sign(tx-q.x)*
   Math.min(Math.abs(tx-q.x),440*dt);
 }

 for(let u of units){
  if(state!=="play")return;

  u.cd=u.cd.map(n=>Math.max(0,n-dt));

  for(let k of ["shield","inv","stun","form","pose"]){
   u[k]=Math.max(0,u[k]-dt);
  }

  if(!alive(u)){
   u.dead-=dt;

   if(u.dead<=0){
    u.dead=0;
    u.hp=u.max;
    u.ki=100;
    u.x=home(u.team);
    u.y=H/2;
    u.form=u.stun=u.shield=0;
    u.inv=2;
    u.nav=0;
   }
   continue;
  }

  u.ki=Math.min(100,u.ki+13*dt);

  if(dist(u,balls[u.team])<280){
   u.hp=Math.min(u.max,u.hp+u.max*.12*dt);
  }

  if(u.stun>0)continue;

  let dx=0,dy=0,act=[];

  if(u===me){
   dx=joy[0]+
    Number(keys.has("KeyD")||keys.has("ArrowRight"))-
    Number(keys.has("KeyA")||keys.has("ArrowLeft"));

   dy=joy[1]+
    Number(keys.has("KeyS")||keys.has("ArrowDown"))-
    Number(keys.has("KeyW")||keys.has("ArrowUp"));

   if(
    keys.has("KeyJ")||
    [...held.values()].includes(0)
   ){
    act.push(0);
   }
  }else{
   let retreat=u.hp<u.max*.22;

   let wild=mobs
    .filter(m=>alive(m)&&m.lane===u.lane)
    .sort((a,b)=>dist(u,a)-dist(u,b))[0];

   let close=nearest(u,700);
   let farm=u.lv<7&&wild;

   let goal=retreat?
    balls[u.team]:
    farm?wild:
    close||(
     open(1-u.team)?
     balls[1-u.team]:
     front(1-u.team,u.lane)
    );

   if(!goal)goal=wild||balls[u.team];

   let stop=
    goal.kind==="ball"&&goal.team===u.team?
    80:ranged(u.id)?360:85;

   // 沒有全王支援，先在破壞神射程外等候。
   if(goal.kind==="god"&&!valid(goal))stop=650;

   if(dist(u,goal)>stop){
    u.nav-=dt;

    if(
     u.nav<=0||!u.wp||
     dist(u,u.wp)<45
    ){
     u.wp=waypoint(u,goal);
     u.nav=.5;
    }

    let d=dist(u,u.wp);
    if(d>1){
     dx=(u.wp.x-u.x)/d;
     dy=(u.wp.y-u.y)/d;
    }
   }

   if(retreat){
    if(behavior[base(u.id)][1]==="heal"){
     act.push(2);
    }
   }else{
    let target=nearest(u,750);

    if(target){
     if(u.lv>=7&&u.ki>85)act.push(5);
     if(u.ki>65)act.push(4);
     if(dist(u,target)<265)act.push(2,3);
     act.push(1,0);
    }
   }
  }

  let n=Math.hypot(dx,dy);

  if(n>.04){
   u.a=Math.atan2(dy,dx);

   let d=
    u.speed*(u.form>0?1.16:1)*
    dt/Math.max(1,n);

   move(u,dx*d,dy*d);
  }

  for(let a of act)cast(u,a);
 }

 // 小怪反擊、回到出生點、死亡後重生。
 for(let m of mobs){
  if(!alive(m)){
   m.dead-=dt;

   if(m.dead<=0){
    m.hp=m.max;
    m.x=m.sx;
    m.y=m.sy;
    m.stun=0;
   }
   continue;
  }

  m.stun=Math.max(0,m.stun-dt);
  if(m.stun>0)continue;

  let target=units
   .filter(u=>alive(u)&&dist(m,u)<390&&clear(m,u))
   .sort((a,b)=>dist(m,a)-dist(m,b))[0];

  if(target){
   let d=dist(m,target);
   let r=m.type==="soldier"?230:65;

   if(d>r&&dist(m,{x:m.sx,y:m.sy})<400){
    move(
     m,
     (target.x-m.x)/d*125*dt,
     (target.y-m.y)/d*125*dt
    );
   }

   m.wait-=dt;

   if(m.wait<=0){
    m.wait=1.2;

    if(m.type==="soldier"){
     fire(
      m,
      Math.atan2(target.y-m.y,target.x-m.x),
      32,8,"#f59895",520,420
     );
    }else if(d<90){
     hit(m,target,35);
    }
   }
  }else{
   let d=dist(m,{x:m.sx,y:m.sy});

   if(d>5){
    move(
     m,
     (m.sx-m.x)/d*100*dt,
     (m.sy-m.y)/d*100*dt
    );
   }
  }
 }

 // 未被全王壓制的破壞神主動攻擊。
 for(let god of gods){
  if(!alive(god))continue;

  god.wait-=dt;

  if(suppressed(god))continue;

  let target=units
   .filter(u=>
    u.team!==god.team&&alive(u)&&
    dist(god,u)<570&&clear(god,u)
   )
   .sort((a,b)=>dist(god,a)-dist(god,b))[0];

  if(target&&god.wait<=0){
   god.wait=.9;

   fire(
    god,
    Math.atan2(target.y-god.y,target.x-god.x),
    175,20,"#dba7ff",740,630
   );
  }
 }

 // 高速氣彈分段檢查碰撞，避免穿牆、穿過角色。
 for(let s of shots){
  let d=Math.min(s.left,s.speed*dt);
  let steps=Math.ceil(d/9);
  let blocked=false;

  for(let j=0;j<steps&&s.left>0;j++){
   s.x+=Math.cos(s.a)*d/steps;
   s.y+=Math.sin(s.a)*d/steps;
   s.left-=d/steps;

   if(inside(s.x,s.y,s.r)){
    blocked=true;
    break;
   }

   for(let o of enemies(s.u)){
    if(s.seen.has(o))continue;

    let r=
     o.kind==="god"?45:
     o.kind==="ball"?48:
     o.kind==="mob"?20:24;

    if(dist(s,o)<s.r+r){
     hit(s.u,o,s.p);
     s.seen.add(o);

     if(!s.pierce){
      s.left=0;
      break;
     }
    }
   }
  }

  if(blocked)s.left=0;
 }

 shots=shots.filter(s=>
  s.left>0&&s.x>0&&s.y>0&&s.x<W&&s.y<H
 );

 let burst=[];

 for(let f of fx){
  f.life-=dt;

  if(f.bomb&&f.life<=0){
   for(let o of enemies(f.u)){
    if(dist(o,f)<f.r&&clear(f,o)){
     hit(f.u,o,f.p);
    }
   }

   burst.push({
    x:f.x,y:f.y,r:f.r,
    c:"#fff0b7",life:.45
   });
  }
 }

 fx=fx.filter(f=>f.life>0).concat(burst);
}

/* ================= 畫面與小地圖 ================= */

const dot=(x,y,r,c)=>{
 g.beginPath();
 g.arc(x,y,r,0,7);
 g.fillStyle=c;
 g.fill();
};

const txt=(s,x,y,size,c)=>{
 g.font="bold "+size+"px system-ui";
 g.fillStyle=c;
 g.textAlign="center";
 g.fillText(s,x,y);
};

function drawImage(im,x,y,scale=1,flip=false){
 if(!im.complete||!im.naturalWidth)return;

 g.save();
 g.translate(x,y);
 g.scale(flip?-scale:scale,scale);
 g.drawImage(im,-45,-83,90,101);
 g.restore();
}

function draw(){
 let cv=$("field");
 let d=Math.min(2,devicePixelRatio||1);

 w=cv.clientWidth;
 h=cv.clientHeight;

 if(
  cv.width!==Math.round(w*d)||
  cv.height!==Math.round(h*d)
 ){
  cv.width=Math.round(w*d);
  cv.height=Math.round(h*d);
 }

 z=Math.max(.5,Math.min(1,w/1100,h/720));
 camX=clamp(me.x,w/2/z,W-w/2/z);
 camY=clamp(me.y,h/2/z,H-h/2/z);

 g.setTransform(d,0,0,d,0,0);
 g.fillStyle="#2c574f";
 g.fillRect(0,0,w,h);

 g.save();
 g.translate(w/2-camX*z,h/2-camY*z);
 g.scale(z,z);

 // 上下兩條路。
 for(let y of LY){
  g.beginPath();
  g.moveTo(220,H/2);
  g.lineTo(900,y);
  g.lineTo(W-900,y);
  g.lineTo(W-220,H/2);
  g.lineWidth=180;
  g.strokeStyle="#788e79";
  g.stroke();
 }

 // 地形裝飾。
 for(let j=0;j<70;j++){
  let x=(j*947+350)%W;
  let y=(j*433+400)%H;

  if(
   LY.every(l=>Math.abs(l-y)>330)&&
   !inside(x,y)
  ){
   dot(x,y,45,"#24483e");
   dot(x-8,y-8,30,"#537255");
  }
 }

 // 中央實體牆。
 g.fillStyle="#263340";
 g.fillRect(wall.x+15,wall.y+18,wall.w,wall.h);
 g.fillStyle="#7a8089";
 g.fillRect(wall.x,wall.y,wall.w,wall.h);
 g.fillStyle="#a0a2a2";
 g.fillRect(wall.x,wall.y,wall.w,25);

 g.strokeStyle="#505964";
 g.lineWidth=3;

 for(let x=wall.x;x<wall.x+wall.w;x+=140){
  g.beginPath();
  g.moveTo(x,wall.y);
  g.lineTo(x,wall.y+wall.h);
  g.stroke();
 }

 for(let y=wall.y;y<wall.y+wall.h;y+=100){
  g.beginPath();
  g.moveTo(wall.x,y);
  g.lineTo(wall.x+wall.w,y);
  g.stroke();
 }

 txt("中央封鎖牆・請走上下路",W/2,H/2,36,"#dae2dc");

 let objects=[...balls,...gods,...mobs,...units]
  .sort((a,b)=>a.y-b.y);

 for(let o of objects){
  if(
   !alive(o)||
   Math.abs(o.x-camX)>w/2/z+250||
   Math.abs(o.y-camY)>h/2/z+250
  )continue;

  let {x,y}=o;
  let name="";
  let c=o.team===2?"#9adb7c":C[o.team];
  let by=y-108;

  dot(x,y+12,o.kind==="god"?53:30,c);

  if(o.kind==="hero"){
   if(o.shield||o.form||o.inv){
    dot(
     x,y-20,48,
     o.shield?"#97daff44":"#ffdc7944"
    );
   }

   let size=[8,9,16].includes(base(o.id))?1.12:1;

   drawImage(
    pics[o.id][Number(o.form>0)],
    x+Math.cos(o.a)*o.pose*25,
    y,size,Math.cos(o.a)<0
   );

   if(o.pose>0&&!ranged(o.id)){
    let px=x+Math.cos(o.a)*52;
    let py=y+Math.sin(o.a)*35;

    g.strokeStyle="#f4c9a3";
    g.lineWidth=13;
    g.beginPath();
    g.moveTo(x,y-25);
    g.lineTo(px,py-25);
    g.stroke();

    dot(px,py-25,11,"#f1c19b");
   }

   name=(o===me?"你・":"")+D[o.id][0]+" Lv."+o.lv;

   if(o.stun>0){
    txt("暈眩",x,y-134,15,"#ffe291");
   }
  }else if(o.kind==="mob"){
   drawImage(npcs[o.type],x,y,.7);
   name={
    saiba:"栽培人",
    junior:"小賽魯",
    soldier:"弗利沙軍士兵"
   }[o.type];
   by=y-75;
  }else if(o.kind==="god"){
   let disabled=suppressed(o);

   drawImage(pics[11][0],x,y,1.6);
   name="破壞神・"+(o.depth?"內防線":"外防線");
   by=y-153;

   txt(
    disabled?"全王壓制：可攻擊":"無敵・進入射程會反擊",
    x,y+45,16,
    disabled?"#ffe191":"#eed8ff"
   );

   if(!disabled){
    g.beginPath();
    g.arc(x,y,75,0,7);
    g.lineWidth=3;
    g.strokeStyle="#ddb3ff";
    g.stroke();
   }
  }else{
   dot(x,y,48,"#ffb936");
   dot(x-14,y-17,10,"#ffe5a0");
   txt("★",x,y+14,32,"#b64123");

   name="龍珠 "+Math.ceil(o.hp)+"/6000";
   txt(open(o.team)?"可攻擊":"防護中",x,y+76,18,c);
  }

  g.fillStyle="#132334";
  g.fillRect(x-40,by,80,7);
  g.fillStyle=c;
  g.fillRect(x-40,by,80*o.hp/o.max,7);
  txt(name,x,by-8,15,"#fff4dc");
 }

 // 全王顯示。
 for(let q of zenos){
  dot(q.x,q.y+10,34,C[q.team]);
  drawImage(npcs.zeno,q.x,q.y,1.05);

  txt(
   "全王・"+(q.team?"紅隊進攻":"藍隊進攻"),
   q.x,q.y-101,18,"#ffebac"
  );
 }

 // 氣彈、光束與爆炸預告。
 for(let s of shots){
  dot(s.x,s.y,s.r,s.c);
  dot(s.x,s.y,s.r*.4,"#fff");
 }

 for(let f of fx){
  g.beginPath();
  g.arc(
   f.x,f.y,
   f.r*(f.bomb?1:Math.max(.1,1-f.life/.45)),
   0,7
  );
  g.strokeStyle=f.c;
  g.lineWidth=4;
  g.stroke();

  if(f.bomb){
   dot(f.x,f.y-f.life*90,30,f.c);
  }
 }

 g.restore();

 // 小地圖。
 let mw=Math.min(180,w*.28);
 let mh=mw*H/W;
 let mx=w-mw-8,my=10;

 g.fillStyle="#102431ed";
 g.fillRect(mx,my,mw,mh);

 g.fillStyle="#89929c";
 g.fillRect(
  mx+wall.x/W*mw,
  my+wall.y/H*mh,
  wall.w/W*mw,
  wall.h/H*mh
 );

 for(let o of [...balls,...gods,...mobs,...units]){
  if(alive(o)){
   dot(
    mx+o.x/W*mw,
    my+o.y/H*mh,
    o===me?4:o.kind==="ball"?3:2,
    o===me?"#fff":
    o.team===2?"#9edb7a":
    C[o.team]
   );
  }
 }

 for(let q of zenos){
  let x=mx+q.x/W*mw;
  let y=my+q.y/H*mh;
  dot(x,y,5,"#ffdf69");
  dot(x,y,2,C[q.team]);
 }

 g.strokeStyle="#ffffff70";
 g.lineWidth=1;
 g.strokeRect(
  mx+(camX-w/2/z)/W*mw,
  my+(camY-h/2/z)/H*mh,
  w/z/W*mw,
  h/z/H*mh
 );

 // 頂部狀態。
 $("hud").textContent=
  D[me.id][0]+" Lv."+me.lv+"｜"+
  (alive(me)?
   "HP "+Math.ceil(me.hp)+"　氣 "+Math.floor(me.ki):
   "復活 "+Math.ceil(me.dead)+" 秒")+
  "｜小怪 "+me.kills+" 隻"+
  (me.lv<12?"（"+me.kills%2+"/2）":"（滿級）")+
  "｜龍珠 "+balls.map(b=>b.hp).join("：");

 if(time>feedUntil){
  $("feed").textContent=
   "上路："+(zenos[0].team?"紅攻／藍守":"藍攻／紅守")+
   "　下路："+(zenos[1].team?"紅攻／藍守":"藍攻／紅守")+
   "｜"+Math.ceil(50-time%50)+"秒後交換";
 }

 let names=[
  (ranged(me.id)?"氣彈":"拳腳")+" J",
  ...N[base(me.id)],
  "變身 F",
  "衝刺"
 ];

 [...$("acts").children].forEach((b,k)=>{
  let locked=me.lv<unlock[k];

  b.textContent=
   names[k]+
   (locked?" Lv."+unlock[k]:
    me.cd[k]>=1?" "+Math.ceil(me.cd[k])+"秒":"");

  b.style.opacity=locked?".45":"1";

  b.classList.toggle(
   "down",
   keys.has(codes[k])||
   [...held.values()].includes(k)
  );
 });

 if(state!=="play"){
  g.fillStyle="#0d1929df";
  g.fillRect(0,h*.35,w,h*.3);

  txt(
   state==="pause"?"已暫停":
   state==="win"?"勝利！取得敵方龍珠":
   "戰敗！我方龍珠被奪走",
   w/2,h*.48,25,"#ffe09c"
  );

  txt(
   state==="pause"?"按 P 或點繼續":
   "點左上「選角」再戰",
   w/2,h*.56,16,"white"
  );
 }
}

/* ================= 主迴圈 ================= */

function frame(now){
 requestAnimationFrame(frame);

 let dt=last?
  Math.min(.033,(now-last)/1000):0;

 last=now;

 if(state==="menu")return;
 if(state==="play")step(dt);
 draw();
}

/* ================= 按鈕與鍵盤 ================= */

codes.forEach((_,k)=>{
 let b=document.createElement("button");
 $("acts").append(b);

 b.onpointerdown=e=>{
  e.preventDefault();
  if(state!=="play")return;

  b.setPointerCapture(e.pointerId);
  held.set(e.pointerId,k);
  cast(me,k);
 };

 b.onpointerup=
 b.onpointercancel=
 b.onlostpointercapture=e=>{
  held.delete(e.pointerId);
 };

 b.oncontextmenu=e=>e.preventDefault();
});

onkeydown=e=>{
 if(state==="menu")return;

 if(e.code==="KeyP"&&!e.repeat){
  pause();
  return;
 }

 if(state!=="play")return;

 if(
  codes.includes(e.code)||
  e.code.startsWith("Arrow")
 ){
  e.preventDefault();
 }

 keys.add(e.code);

 let k=codes.indexOf(e.code);

 if(k>=0&&!e.repeat){
  cast(me,k);
 }
};

onkeyup=e=>keys.delete(e.code);

/* ================= 觸控搖桿 ================= */

const pad=$("pad");

function stick(e){
 let r=pad.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let n=Math.max(32,Math.hypot(x,y));

 joy=[x/n,y/n];

 $("nub").style.transform=
  "translate("+joy[0]*32+"px,"+joy[1]*32+"px)";
}

pad.onpointerdown=e=>{
 e.preventDefault();

 if(pid!==null||state!=="play")return;

 pid=e.pointerId;
 pad.setPointerCapture(pid);
 stick(e);
};

pad.onpointermove=e=>{
 if(e.pointerId===pid)stick(e);
};

pad.onpointerup=
pad.onpointercancel=
pad.onlostpointercapture=e=>{
 if(pid===e.pointerId){
  pid=null;
  joy=[0,0];
  $("nub").style.transform="";
 }
};

onblur=()=>{
 if(state==="play")pause();
};

document.onvisibilitychange=()=>{
 if(document.hidden&&state==="play")pause();
};

requestAnimationFrame(frame);
</script>
