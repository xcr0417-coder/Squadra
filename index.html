<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七龍珠：激震小隊 (簡易4v4對戰版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #3e8e41; /* 草地背景 */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #f1c40f;
            border-radius: 8px;
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border: 2px solid #f1c40f;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #e67e22;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-layer">
        <h2 style="margin:0; color:#3498db;">藍隊 (你的隊伍) : <span id="blue-score">4</span></h2>
        <h2 style="margin:0; color:#e74c3c;">紅隊 (敵方隊伍) : <span id="red-score">4</span></h2>
        <p>控制：WASD移動，滑鼠點擊發射氣功波</p>
    </div>
    <div id="game-over">
        <h1 id="result-text">戰鬥結束</h1>
        <button onclick="location.reload()">重新開戰</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const blueScoreEl = document.getElementById('blue-score');
    const redScoreEl = document.getElementById('red-score');
    const gameOverEl = document.getElementById('game-over');
    const resultTextEl = document.getElementById('result-text');

    const keys = { w: false, a: false, s: false, d: false };
    const mouse = { x: 0, y: 0, clicked: false };

    window.addEventListener('keydown', e => {
        if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', e => {
        if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });
    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => mouse.clicked = true);
    canvas.addEventListener('mouseup', () => mouse.clicked = false);

    class Character {
        constructor(x, y, team, isPlayer = false, role = 'damage') {
            this.x = x;
            this.y = y;
            this.team = team; // 'blue' or 'red'
            this.isPlayer = isPlayer;
            this.role = role; // 'damage', 'tank', 'tech'
            
            this.radius = role === 'tank' ? 20 : 15;
            this.maxHp = role === 'tank' ? 300 : (role === 'damage' ? 150 : 100);
            this.hp = this.maxHp;
            this.speed = role === 'tank' ? 1.5 : (role === 'damage' ? 3 : 2.5);
            this.color = team === 'blue' ? (isPlayer ? '#3498db' : '#2980b9') : '#e74c3c';
            
            this.cooldown = 0;
            this.maxCooldown = role === 'damage' ? 30 : 60;
        }

        draw() {
            if (this.hp <= 0) return;
            
            // 角色本體
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            if(this.isPlayer) {
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // 血條
            ctx.fillStyle = 'red';
            ctx.fillRect(this.x - 20, this.y - this.radius - 10, 40, 5);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(this.x - 20, this.y - this.radius - 10, 40 * (this.hp / this.maxHp), 5);
        }

        update(entities) {
            if (this.hp <= 0) return;
            if (this.cooldown > 0) this.cooldown--;

            if (this.isPlayer) {
                // 玩家控制
                if (keys.w && this.y > this.radius) this.y -= this.speed;
                if (keys.s && this.y < canvas.height - this.radius) this.y += this.speed;
                if (keys.a && this.x > this.radius) this.x -= this.speed;
                if (keys.d && this.x < canvas.width - this.radius) this.x += this.speed;

                if (mouse.clicked && this.cooldown === 0) {
                    this.shoot(mouse.x, mouse.y);
                    this.cooldown = this.maxCooldown;
                }
            } else {
                // AI 控制
                let target = null;
                let minDist = Infinity;

                entities.forEach(ent => {
                    if (ent !== this && ent.team !== this.team && ent.hp > 0) {
                        const dist = Math.hypot(ent.x - this.x, ent.y - this.y);
                        if (dist < minDist) {
                            minDist = dist;
                            target = ent;
                        }
                    }
                });

                if (target) {
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const angle = Math.atan2(dy, dx);

                    // 保持一定距離射擊
                    if (minDist > 200) {
                        this.x += Math.cos(angle) * this.speed;
                        this.y += Math.sin(angle) * this.speed;
                    } else if (minDist < 100) {
                        this.x -= Math.cos(angle) * this.speed;
                        this.y -= Math.sin(angle) * this.speed;
                    }

                    // 邊界限制
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                    // 射擊
                    if (this.cooldown === 0 && Math.random() < 0.05) {
                        this.shoot(target.x, target.y);
                        this.cooldown = this.maxCooldown;
                    }
                }
            }
        }

        shoot(targetX, targetY) {
            const angle = Math.atan2(targetY - this.y, targetX - this.x);
            projectiles.push(new Projectile(this.x, this.y, angle, this.team, this.role === 'damage' ? 25 : 15));
        }
    }

    class Projectile {
        constructor(x, y, angle, team, damage) {
            this.x = x;
            this.y = y;
            this.vx = Math.cos(angle) * 7;
            this.vy = Math.sin(angle) * 7;
            this.team = team;
            this.damage = damage;
            this.radius = team === 'blue' ? 6 : 5;
            this.color = team === 'blue' ? '#8e44ad' : '#f39c12';
            this.active = true;
        }

        draw() {
            if (!this.active) return;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 0; // reset
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                this.active = false;
            }
        }
    }

    // 初始化隊伍 (4v4)
    let entities = [];
    let projectiles = [];
    let isGameOver = false;

    // 藍隊 (玩家 + 3 AI)
    entities.push(new Character(100, 300, 'blue', true, 'damage')); // 玩家
    entities.push(new Character(100, 150, 'blue', false, 'tank'));
    entities.push(new Character(100, 450, 'blue', false, 'tech'));
    entities.push(new Character(50, 300, 'blue', false, 'damage'));

    // 紅隊 (4 AI)
    entities.push(new Character(700, 300, 'red', false, 'damage'));
    entities.push(new Character(700, 150, 'red', false, 'tank'));
    entities.push(new Character(700, 450, 'red', false, 'tech'));
    entities.push(new Character(750, 300, 'red', false, 'damage'));

    function checkCollisions() {
        projectiles.forEach(p => {
            if (!p.active) return;
            entities.forEach(e => {
                if (e.hp > 0 && e.team !== p.team) {
                    const dist = Math.hypot(e.x - p.x, e.y - p.y);
                    if (dist < e.radius + p.radius) {
                        e.hp -= p.damage;
                        p.active = false;
                    }
                }
            });
        });
    }

    function gameLoop() {
        if (isGameOver) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 更新與繪製實體
        let blueAlive = 0;
        let redAlive = 0;

        entities.forEach(e => {
            e.update(entities);
            e.draw();
            if (e.hp > 0) {
                if (e.team === 'blue') blueAlive++;
                if (e.team === 'red') redAlive++;
            }
        });

        blueScoreEl.innerText = blueAlive;
        redScoreEl.innerText = redAlive;

        // 更新與繪製子彈
        projectiles.forEach(p => {
            p.update();
            p.draw();
        });
        
        checkCollisions();

        // 移除失效子彈
        projectiles = projectiles.filter(p => p.active);

        // 勝負判斷
        if (blueAlive === 0 || redAlive === 0) {
            isGameOver = true;
            gameOverEl.style.display = 'block';
            if (blueAlive > 0) {
                resultTextEl.innerText = '勝利！敵方小隊已全滅';
                resultTextEl.style.color = '#3498db';
            } else {
                resultTextEl.innerText = '失敗！我方小隊已全滅';
                resultTextEl.style.color = '#e74c3c';
            }
        }

        if (!isGameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    gameLoop();
</script>

</body>
</html>
