<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>龍珠小隊戰場 III</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b29;color:#fff3d4;font:15px system-ui}canvas#field{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button,select{font:inherit;color:inherit;background:#223349;border:1px solid #697b8d;border-radius:8px;padding:8px;touch-action:none}button{cursor:pointer;user-select:none;-webkit-user-select:none}.sheet{position:fixed;inset:0;overflow:auto;background:linear-gradient(135deg,#14243a,#0b131f);padding:clamp(14px,4vw,50px)}main{max-width:980px;margin:auto}h1{font-size:clamp(26px,5vw,50px);margin:.12em 0}small{color:#ffc660;letter-spacing:.14em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:7px}.card{display:grid;justify-items:center;background:linear-gradient(150deg,#314458,#192639);padding:4px}.card.sel{border:2px solid #ffc660;background:#51412c}.card svg{height:75px}.card span{font-size:12px;color:#d4dfeb}.gold{background:#ffbd56;color:#241b0f;font-weight:bold}.launch{position:sticky;bottom:0;background:#152439;padding:9px;border-radius:9px;margin-top:12px}#bar,#pad,#acts{position:fixed}#bar{top:6px;left:8px;background:#112034e8;padding:5px;border-radius:8px;font-size:12px;max-width:68%}#pad{bottom:16px;left:18px;width:100px;height:100px;border:2px solid #a4c3cf80;border-radius:50%;background:#15273b88;touch-action:none;display:grid;place-items:center}#nub{background:#cbe5ed99;width:38px;height:38px;border-radius:50%;pointer-events:none}#acts{bottom:12px;right:10px;display:grid;grid-template-columns:repeat(3,minmax(45px,1fr));gap:4px}#acts button{font-size:12px;min-height:43px;background:#192e46ee}#acts button.down{background:#866022}[hidden]{display:none!important}p{line-height:1.6}

<canvas id="field"></canvas>
<div id="ui" hidden>
 <div id="bar"><span id="hud"></span> <button id="pause">暫停</button> <button id="back">選角</button></div>
 <div id="pad"><i id="nub"></i></div><div id="acts"></div>
</div>
<section id="menu" class="sheet"><main>
 <small>英雄圖鑑　／　VOL. 03</small><h1>龍珠小隊戰場</h1>
 <p>選一位戰士，和三名隊友突破任一路外塔、內塔，再擊破敵方龍珠的 6,000 點耐久。</p>
 <div id="cards" class="grid"></div>
 <div class="launch"><b id="detail"></b>
  <select id="diff"><option value=".8">練習</option><option selected value="1">普通</option><option value="1.2">困難</option></select>
  <button class="gold" id="start">出戰 →</button>
 </div>
 <p>WASD／方向鍵移動，長按 J 普攻、Q 氣功。E 特殊技、R 大絕、空白鍵衝刺、F 強化、P 暫停。iPad 可同時推搖桿與長按攻擊。大絕於 Lv.2、強化於 Lv.3 解鎖。</p>
</main></section>
<script>
"use strict";
const $=s=>document.getElementById(s),g=$("field").getContext("2d"),
 W=1800*Math.sqrt(10),H=1000*Math.sqrt(10),C=["#68dbff","#ff788c"];

// 名稱、衣色、膚色、髮色、生命、攻擊、速度、特殊技、大絕、強化
const D=[
["悟空","#f48128","#f4bd93","#182033",1250,48,330,"瞬身連擊","元氣彈","超級賽亞人"],
["貝吉達","#304dc3","#edb18e","#141829",1700,40,310,"戰鬥護盾","終極閃光","超級賽亞人"],
["比克","#694496","#8ac668","#fff",1400,41,320,"再生領域","魔貫光殺炮","潛能解放"],
["克林","#ee932e","#eeb18c","#000",1200,39,350,"太陽拳","連續氣圓斬","潛能解放"],
["悟飯","#704592","#efb68c","#212333",1320,49,335,"爆發連擊","究極氣功","野獸悟飯"],
["特南克斯","#627fc7","#f2c49e","#b4a0de",1380,47,350,"劍刃旋風","燃燒攻擊","超級賽亞人"],
["弗利沙","#f1e6ec","#eee1ed","#9865bc",1250,50,330,"死亡光束","超新星","黃金弗利沙"],
["賽魯","#75a956","#aad082","#384743",1570,43,315,"生命吸收","完全體氣功","超完全體"],
["魔人普烏","#352f44","#f4a2be","#ef91b0",1850,35,295,"魔人再生","爆發波","魔人強化"],
["布羅利","#79b24f","#dba680","#232735",2050,46,290,"狂暴震地","巨型能量彈","傳說超級賽亞人"],
["希特","#554d71","#ae96be","#65597a",1230,47,365,"閃時突襲","時之牢籠","時間解放"],
["比魯斯","#3e90ae","#a484c5","#ae85c9",1390,52,340,"破壞衝擊","破壞能量球","破壞神之力"],
["人造人17號","#242b32","#f1c19d","#222531",1310,44,346,"能源防護壁","超級電擊","能量提升"],
["人造人18號","#557bb1","#f1c6a2","#f2d071",1290,46,340,"連環飛踢","雙重氣圓斬","能量提升"],
["札馬斯","#46475d","#9aca86","#eff4eb",1480,42,325,"神之再生","神裂光刃","神氣解放"],
["達普拉","#4267a4","#d9645c","#272036",1560,44,313,"石化魔唾","魔界烈焰","魔王之力"],
["克維拉","#695083","#9277ac","#e5e6eb",1740,46,316,"裝甲突擊","超級新星","能量全開"],
["悟吉塔","#302e39","#efb58f","#f9d454",1440,51,355,"星塵突擊","星塵碎擊","超藍悟吉塔"]
];

const path=(d,f)=>'<path d="'+d+'" fill="'+f+'"/>';
const oval=(x,y,a,b,f)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+a+'" ry="'+b+'" fill="'+f+'"/>';

// 同一套向量圖用於角色卡及戰場，不需外部圖片。
function art(i,on=false){
 let [,s,k,h]=D[i],ink="#20202c",gold="#ffdd64",white="#fff2dc",p=path,e=oval;
 if(on){
  if([0,1,5].includes(i))h=gold;
  if(i===4)h="#e9e7ff";
  if(i===9)h="#b7ef48";
  if(i===17)h="#41caff";
  if(i===6)s=k="#e8bc48";
 }
 let a="",b="",head="",extra="";
 if([2,8,15].includes(i))
  a+=p("M32 53Q50 43 67 53L84 96 59 87 43 100 17 96Z",i===2?"#eeeae0":i===8?"#775392":"#ede4d0");
 if([6,11,16].includes(i))
  a+=p("M55 82Q92 102 86 56Q99 102 73 101L48 93Z",k);
 if(i===5)
  a+=p("M18 95L67 35 72 39 23 101Z","#c3d6df")+p("M61 40L77 48 80 44 64 35Z","#cda846");
 if(i===7)a+=p("M30 56L15 100 42 89 58 89 83 100 69 56Z","#27313a");

 let pants=[8,17].includes(i)?"#f8efdb":[0,3,4].includes(i)?s:"#344059";
 b+=p("M36 78L64 78 67 97 56 105 50 90 44 104 31 99Z",pants)
   +p("M32 96L44 99 43 108 26 108Z M56 98L66 96 74 107 57 108Z","#27354c");
 b+=p("M32 51Q48 45 68 51L73 65 63 70 64 84Q49 90 34 83L35 68 26 64Z",s);
 if([0,3,4].includes(i))
  b+=p("M36 51L50 67 61 51 54 50 49 58 43 50Z","#243b65")+e(59,63,4,4,"#fff4d5");
 if(i===1)b+=p("M32 52L38 50 41 58 58 58 61 50 67 52 63 72 38 72Z","#e8e9de")
  +p("M39 69L62 69 59 79 41 79Z","#dab26b");
 if(i===2)b+=p("M26 53Q39 43 51 53Q63 43 73 54L60 65 49 59 36 65Z","#fcf7e7");
 if(i===8)b+=e(50,76,22,15,k)+p("M29 81Q50 90 71 81L67 90 34 90Z",gold);
 if(i===9)b+=p("M31 54Q50 45 68 53L64 76 50 81 35 75Z",k)
  +p("M33 77L67 77 70 92 59 87 53 94 43 87 31 91Z","#8bb94b");
 if([10,14,15].includes(i))b+=p("M35 54L49 61 64 51 59 78 66 96 51 90 34 97 40 78Z",s);
 if(i===11)b+=p("M31 52Q50 64 69 52L62 66 50 72 37 65Z","#202938")+p("M49 60L56 66 50 72 44 66Z","#f6cb60");
 if(i===12)b+=p("M31 52L65 52 48 64Z","#f18a39");
 if(i===13)b+=p("M36 52L43 53 45 77 56 77 57 52 64 52 66 81 35 81Z","#344d79");
 if(i===17)b+=p("M32 51Q38 45 46 51L42 68 34 60Z M55 51Q63 45 69 53L64 63 57 68Z","#f5bb46")
  +p("M43 55L56 54 53 77 46 78Z",k);
 b+=p("M34 78Q49 82 65 78L64 84 35 85Z",i===14?"#e25650":i===8?gold:"#30486c");
 b+=p("M28 59Q19 66 22 77L30 79 38 66Z M68 58L78 63 84 58 90 64Q81 82 69 75L61 66Z",k);
 if(i===13)for(let j=0;j<3;j++)b+=p("M"+(24+j)+" "+(68+j*3)+"l8 3 1 -2 -8 -3Z",ink);

 if([2,14,15].includes(i))head+=p("M34 34L19 27 31 45 39 45 M66 34L81 27 70 44 62 45",k);
 if(i===11)head+=p("M35 36Q23 1 30 3L46 27 M54 27L69 2Q77 2 65 38",k);
 head+=p("M31 32Q30 15 50 15Q70 15 69 34L66 45 54 54 46 54 34 44Z",k);
 head+=p("M35 33L47 37 45 41 36 39Z M53 37L65 33 63 39 55 41Z",i===11?gold:"#fff")
  +p("M42 36L45 37 44 40 42 39Z M56 37L59 36 58 40 56 40Z",ink)
  +p("M46 46Q51 48 56 45L51 48Z",ink);
 if([0,1,4,9,17].includes(i)){
  const styles=[
   "M28 37L16 29 29 26 11 17 36 19 29 7 44 15 53 2 59 16 77 9 70 22 82 23 65 34 65 27 53 26 43 37 44 26 34 31Z",
   "M31 34L23 18 30 20 27 6 40 14 44 0 51 10 58 1 60 12 72 7 69 23 65 33 58 24 50 33 41 24Z",
   "M28 31L20 15 33 18 28 4 44 12 53 1 60 12 73 6 70 22 62 30 53 24 44 41 45 26Z"
  ];
  head+=p(styles[i===1?1:i===4?2:0],h);
 }
 if([5,12,13].includes(i))
  head+=p(i===13?"M29 47Q21 17 39 13Q68 3 72 31L71 54 61 47 62 22Q48 30 34 33L35 48Z":"M27 48Q21 12 43 12Q69 7 73 31L70 53 61 43 61 29 50 19 36 34 35 46Z",h);
 if(i===2)head+=p("M29 31Q27 12 42 15Q48 6 62 17L69 29 55 25 38 31Z","#f2eee0");
 if(i===3)for(let j=0;j<6;j++)head+=e(46+j%2*7,21+Math.floor(j/2)*4,1,1,"#77523e");
 if(i===6)head+=e(50,23,15,8,"#9855b3");
 if(i===7||i===16)head+=p("M28 37L22 8 43 18 52 23 71 4 75 30 65 38 61 29 39 29Z",i===7?"#79a855":"#e8e6ef");
 if(i===7)for(const [x,y] of [[31,21],[35,24],[64,21],[66,17],[39,58],[57,70]])extra+=e(x,y,2,2,ink);
 if(i===16)head+=p("M32 40L48 44 68 35 63 48 51 55 38 49Z","#e8e6ef");
 if(i===8)head+=p("M43 19Q43 3 59 7Q70 13 78 6Q76 20 59 16L54 23Z",k);
 if(i===10)head+=p("M47 16L51 15 52 31 49 34Z","#877491");
 if(i===14)head+=p("M28 31Q23 20 34 14L23 9 41 10 42 2 55 9 75 5 66 17 74 18 60 27 51 20 36 31Z",h)+e(70,44,3,5,gold);
 if(i===15)head+=p("M32 23L32 8 43 20Z M59 19L68 7 67 25Z",white)+p("M41 44L50 41 59 44 52 45 50 53 46 45Z",ink);
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112"><g stroke="#252237" stroke-width="1.4" stroke-linejoin="round">'+a+b+head+extra+'</g></svg>';
}
const pics=D.map((_,i)=>[false,true].map(f=>{
 let im=new Image();im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(art(i,f));return im
}));
let pick=0;
function choose(i){
 pick=i;$("detail").textContent=D[i][0]+"｜"+D[i][7]+"・"+D[i][8];
 [...$("cards").children].forEach((b,j)=>b.classList.toggle("sel",i===j))
}
D.forEach((d,i)=>{
 let b=document.createElement("button");b.className="card";
 b.innerHTML=art(i)+"<b>"+d[0]+"</b><span>"+d[7]+"</span>";
 b.onclick=()=>choose(i);$("cards").append(b)
});choose(0);

const clamp=(x,a,b)=>Math.max(a,Math.min(x,b)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),home=t=>t?W-220:220;
let units=[],towers=[],balls=[],shots=[],fx=[],me,state="menu",t=0,last=0,score,camX,camY,z,w,h;
const keys=new Set(),held=new Map(),codes=["KeyJ","KeyQ","KeyE","KeyR","Space","KeyF"],
 cost=[0,5,25,50,12,60],cd=[.28,.32,7,18,2.8,30];
let joy=[0,0],pid=null;
const reset=()=>{keys.clear();held.clear();pid=null;joy=[0,0];$("nub").style.transform=""};

function start(){
 let pool=D.map((_,i)=>i).filter(i=>i!==pick);
 for(let i=pool.length-1;i;i--){
  let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]
 }
 pool.unshift(pick);
 units=pool.slice(0,8).map((id,i)=>{
  let team=i>>2,d=D[id],m=team?+$("diff").value:1;
  return {id,team,x:home(team),y:H/2+(i%4-1.5)*70,lane:i%2,
   hp:d[4]*m,max:d[4]*m,power:d[5]*m,speed:d[6],ki:100,lv:1,xp:0,
   cd:Array(6).fill(0),a:team?Math.PI:0,form:0,shield:0,stun:0,inv:0,dead:0,pose:0,ko:0}
 });
 balls=[0,1].map(team=>({team,x:home(team),y:H/2,hp:6000,max:6000,ball:true}));towers=[];
 for(let team of [0,1])for(let lane of [0,1])for(let depth of [0,1]){
  let f=depth?.20:.35,max=depth?2300:1800;
  towers.push({team,lane,depth,x:W*(team?1-f:f),y:H*(lane?.71:.29),hp:max,max,tower:true,wait:0})
 }
 shots=[];fx=[];score=[0,0];t=0;me=units[0];state="play";reset();
 $("menu").hidden=true;$("ui").hidden=false;$("pause").textContent="暫停";
}
$("start").onclick=start;
function menu(){state="menu";reset();$("menu").hidden=false;$("ui").hidden=true}
$("back").onclick=menu;
function pause(){
 if(!["play","pause"].includes(state))return;
 state=state==="play"?"pause":"play";reset();
 $("pause").textContent=state==="play"?"暫停":"繼續"
}
$("pause").onclick=pause;

const open=team=>[0,1].some(l=>!towers.some(b=>b.team===team&&b.lane===l&&b.hp>0));
const valid=o=>o.hp>0&&(o.ball?open(o.team):!o.tower||!o.depth||
 !towers.some(b=>b.team===o.team&&b.lane===o.lane&&!b.depth&&b.hp>0));
const foes=u=>[...units,...towers,...balls].filter(o=>u.team!==o.team&&valid(o));
const near=(u,r)=>foes(u).filter(o=>dist(u,o)<r).sort((a,b)=>dist(u,a)-dist(u,b))[0];
function gain(u,n){
 if(u.id==null||u.lv>=10)return;u.xp+=n;
 if(u.xp>=90*u.lv){u.xp-=90*u.lv++;u.max+=110;u.power+=5;if(u.hp>0)u.hp=Math.min(u.max,u.hp+230)}
}
function hit(u,o,n){
 if(state!=="play"||!valid(o)||o.inv>0)return 0;
 let v=Math.min(o.hp,Math.round(n*(o.shield>0?.45:1)));o.hp-=v;
 if(o.hp===0){
  if(o.ball){state=u.team?"lose":"win";reset()}
  else if(o.tower){units.filter(h=>h.team===u.team).forEach(h=>gain(h,85))}
  else{o.dead=7+o.lv*.65;score[u.team]++;if(u.id!=null){u.ko++;gain(u,100)}}
 }return v
}
const ring=(x,y,r,c)=>fx.push({x,y,r,c,life:.45});
function fire(u,a,p,r=8,c="#a8eaff",speed=820,range=670,pierce=false){
 shots.push({u,x:u.x,y:u.y,a,p,r,c,speed,left:range,pierce,seen:new Set()})
}
const sp=["rush","guard","heal","stun","rush","spin","snipe","drain","heal","spin","time","spin","guard","rush","heal","stone","rush","rush"];
const ul=["bomb","beam","beam","disc","beam","bomb","bomb","beam","nova","bomb","freeze","bomb","beam","disc","beam","fan","bomb","fan"];

function cast(u,k){
 if(state!=="play"||u.hp<=0||u.stun>0||u.cd[k]>0||u.ki<cost[k]||
    (k===3&&u.lv<2)||(k===5&&u.lv<3))return;
 u.cd[k]=cd[k];u.ki-=cost[k];
 let o=k===4?null:near(u,[350,650,440,780,0,0][k]),p=u.power*(u.form>0?1.4:1);
 if(o)u.a=Math.atan2(o.y-u.y,o.x-u.x);
 const zone=(x,y,r,n,st=0)=>{
  let total=0;ring(x,y,r,"#ffda89");
  for(let v of foes(u))if(dist({x,y},v)<r){
   let dmg=hit(u,v,n);total+=dmg;if(dmg&&v.id!=null)v.stun=Math.max(st,v.stun)
  }return total
 };
 const mend=r=>units.filter(v=>v.hp>0&&v.team===u.team&&dist(u,v)<r)
  .forEach(v=>v.hp=Math.min(v.max,v.hp+330));
 if(k===0){
  u.pose=.18;
  if(o&&dist(u,o)<110){hit(u,o,p*1.25);ring(o.x,o.y,34,"#fff2bc")}
  else fire(u,u.a,p,7,"#ffdc8e",680,350)
 }
 if(k===1)fire(u,u.a,p*1.25,12);
 if(k===4){
  u.x=clamp(u.x+235*Math.cos(u.a),40,W-40);u.y=clamp(u.y+235*Math.sin(u.a),40,H-40);
  u.inv=.3;ring(u.x,u.y,45,C[u.team])
 }
 if(k===5){u.form=13;ring(u.x,u.y,100,"#ffde77")}
 if(k===2){
  let s=sp[u.id];
  if(s==="guard")u.shield=5;
  else if(s==="heal"){mend(280);ring(u.x,u.y,280,"#99f0ae")}
  else if(s==="snipe")fire(u,u.a,4.2*p,10,"#e79aff",1050,900,true);
  else if(s==="rush"||s==="time"){
   if(o){
    u.x=clamp(o.x-65*Math.cos(u.a),40,W-40);u.y=clamp(o.y-65*Math.sin(u.a),40,H-40);
    u.pose=.35;if(hit(u,o,p*3.5)&&s==="time"&&o.id!=null)o.stun=1.4
   }ring(u.x,u.y,85,"#edd8ff")
  }else{
   let v=zone(u.x,u.y,250,p*(s==="stun"?1:3),["stone","stun"].includes(s)?1.8:0);
   if(s==="drain")u.hp=Math.min(u.max,u.hp+.65*v)
  }
 }
 if(k===3){
  let s=ul[u.id],x=o?.x??u.x+440*Math.cos(u.a),y=o?.y??u.y+440*Math.sin(u.a);
  if(s==="bomb")fx.push({x,y,r:190,c:"#93e2ff",life:.85,bomb:true,u,p:7*p});
  if(s==="beam")fire(u,u.a,7*p,26,"#dbb6ff",1050,950,true);
  if(s==="disc"||s==="fan")for(let j=-1;j<=1;j++)
   fire(u,u.a+j*.16,3.8*p,16,s==="disc"?"#ffe478":"#ffad81",800,950,true);
  if(s==="nova"){zone(u.x,u.y,380,p*6);mend(380)}
  if(s==="freeze")zone(x,y,260,p*4.5,2.5)
 }
}

// 戰鬥更新
function step(dt){
 t+=dt;
 for(let u of units){
  if(state!=="play")return;
  u.cd=u.cd.map(n=>Math.max(0,n-dt));
  for(let s of ["inv","form","stun","shield","pose"])u[s]=Math.max(0,u[s]-dt);
  if(u.hp<=0){
   if((u.dead-=dt)<=0){
    u.x=home(u.team);u.y=H/2;u.hp=u.max;u.ki=100;u.inv=2;u.stun=u.form=0
   }continue
  }
  gain(u,3.6*dt);u.ki=Math.min(100,u.ki+13*dt);
  if(dist(u,balls[u.team])<260)u.hp=Math.min(u.max,u.hp+u.max*.13*dt);
  if(u.stun>0)continue;
  let dx=0,dy=0,act=[];
  if(u===me){
   dx=joy[0]+Number(keys.has("KeyD")||keys.has("ArrowRight"))-Number(keys.has("KeyA")||keys.has("ArrowLeft"));
   dy=joy[1]+Number(keys.has("KeyS")||keys.has("ArrowDown"))-Number(keys.has("KeyW")||keys.has("ArrowUp"));
   act=[0,1].filter(k=>keys.has(codes[k])||[...held.values()].includes(k))
  }else{
   let enemy=near(u,680),run=u.hp<u.max*.19;
   let goal=run?balls[u.team]:enemy||(open(1-u.team)?balls[1-u.team]:
    towers.find(o=>o.team!==u.team&&o.lane===u.lane&&valid(o)));
   if(goal&&dist(u,goal)>(run?50:240)){
    let n=dist(u,goal);dx=(goal.x-u.x)/n;dy=(goal.y-u.y)/n
   }
   if(enemy&&!run){
    let n=dist(u,enemy);
    if(u.lv>=3&&u.ki>88)act.push(5);
    if(n<620)act.push(3);
    if(n<245||(["snipe","rush","time"].includes(sp[u.id])&&n<430))act.push(2);
    if(n<350)act.push(0);act.push(1)
   }else if(run&&sp[u.id]==="heal")act.push(2)
  }
  let len=Math.hypot(dx,dy);
  if(len>.05){
   u.a=Math.atan2(dy,dx);let d=u.speed*(u.form>0?1.18:1)*dt/Math.max(1,len);
   u.x=clamp(u.x+dx*d,40,W-40);u.y=clamp(u.y+dy*d,40,H-40)
  }
  for(let k of act)cast(u,k)
 }
 for(let b of towers)if(b.hp>0&&(b.wait-=dt)<=0){
  let o=units.filter(v=>v.team!==b.team&&v.hp>0&&dist(b,v)<490)
   .sort((a,c)=>dist(b,a)-dist(b,c))[0];
  if(o){b.wait=1;fire(b,Math.atan2(o.y-b.y,o.x-b.x),105,12,C[b.team],620,550)}
 }
 for(let s of shots){
  let d=Math.min(s.left,s.speed*dt);
  s.x+=Math.cos(s.a)*d;s.y+=Math.sin(s.a)*d;s.left-=d;
  for(let o of foes(s.u)){
   if(!s.seen.has(o)&&dist(s,o)<s.r+(o.ball?48:o.tower?36:23)){
    hit(s.u,o,s.p);s.seen.add(o);if(!s.pierce){s.left=0;break}
   }
  }
 }
 shots=shots.filter(s=>s.left>0);
 for(let f of fx){
  f.life-=dt;
  if(f.bomb&&f.life<=0){
   for(let o of foes(f.u))if(dist(o,f)<f.r)hit(f.u,o,f.p);
   ring(f.x,f.y,f.r,"#fff3bb")
  }
 }fx=fx.filter(f=>f.life>0);
}

const dot=(x,y,r,c)=>{
 g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=c;g.fill()
};
const txt=(s,x,y,size,c)=>{
 g.fillStyle=c;g.font="bold "+size+"px system-ui";g.textAlign="center";g.fillText(s,x,y)
};
function frame(now){
 requestAnimationFrame(frame);let dt=Math.min(.033,(now-last)/1000);last=now;
 if(state==="menu")return;if(state==="play")step(dt);
 let cv=$("field"),d=Math.min(2,devicePixelRatio||1);
 w=cv.clientWidth;h=cv.clientHeight;
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){
  cv.width=Math.round(w*d);cv.height=Math.round(h*d)
 }
 z=Math.max(.45,Math.min(1,w/1050,h/680));
 camX=clamp(me.x,w/2/z,W-w/2/z);camY=clamp(me.y,h/2/z,H-h/2/z);
 g.setTransform(d,0,0,d,0,0);g.fillStyle="#315c56";g.fillRect(0,0,w,h);
 g.save();g.translate(w/2-camX*z,h/2-camY*z);g.scale(z,z);
 g.fillStyle="#37778b";g.fillRect(W/2-92,0,184,H);
 for(let l of [.29,.71]){
  g.beginPath();g.moveTo(220,H/2);g.lineTo(W*.2,H*l);g.lineTo(W*.8,H*l);
  g.lineTo(W-220,H/2);g.strokeStyle="#859580";g.lineWidth=175;g.stroke()
 }
 for(let j=0;j<75;j++){
  let x=(450+j*431)%W,y=(180+j*719)%H;
  if(Math.min(Math.abs(y-.29*H),Math.abs(y-.71*H))>130){
   dot(x,y,33,"#244c49");dot(x-6,y-6,23,"#48735c")
  }
 }
 for(let o of [...balls,...towers,...units].sort((a,b)=>a.y-b.y)){
  if(o.hp<=0||Math.abs(o.x-camX)>w/2/z+110||Math.abs(o.y-camY)>h/2/z+120)continue;
  let x=o.x,y=o.y,c=C[o.team],name;
  if(o.id!=null){
   let big=[8,9,16].includes(o.id)?1.18:o.id===3?.87:1;
   let im=pics[o.id][Number(o.form>0)];
   g.save();g.translate(x,y);g.scale(Math.cos(o.a)<0?-1:1,1);
   g.beginPath();g.ellipse(0,17,34,11,0,0,7);g.fillStyle=o===me?"#ffe68a":c;g.fill();
   if(o.shield||o.form||o.inv)dot(0,-13,46,o.shield?"#87caff55":"#ffdb6650");
   g.rotate(o.pose>0?.14:0);
   if(im.complete&&im.naturalWidth)g.drawImage(im,-44*big,-76*big,88*big,99*big);
   g.restore();name=(o===me?"你・":"")+D[o.id][0]+" "+o.lv
  }else if(o.ball){
   dot(x,y,48,"#ffb336");txt("★",x,y+12,33,"#be4d13");
   name=valid(o)?"龍珠 "+o.hp:"龍珠・防護中"
  }else{
   g.fillStyle=c;g.fillRect(x-29,y-30,58,64);dot(x,y-28,22,"#ebecdf");
   name=(o.depth?"內塔":"外塔")+(valid(o)?"":"・防護中")
  }
  g.fillStyle="#142434";g.fillRect(x-32,y-91,64,6);
  g.fillStyle=c;g.fillRect(x-32,y-91,64*o.hp/o.max,6);txt(name,x,y-97,16,"#fff6df")
 }
 for(let s of shots){dot(s.x,s.y,s.r,s.c);dot(s.x,s.y,s.r*.45,"#fff")}
 for(let f of fx){
  g.beginPath();g.arc(f.x,f.y,f.r*(f.bomb?1:Math.max(.1,1-f.life/.45)),0,7);
  g.strokeStyle=f.c;g.lineWidth=4;g.stroke();if(f.bomb)dot(f.x,f.y-f.life*90,27,f.c)
 }g.restore();

 // 小地圖與狀態列
 let mw=Math.min(160,w*.26),mh=mw*H/W,mx=w-mw-8;
 g.fillStyle="#101e2cea";g.fillRect(mx,8,mw,mh);
 for(let l of [.29,.71]){g.fillStyle="#576859";g.fillRect(mx,8+mh*l,mw,2)}
 for(let o of [...balls,...towers,...units])if(o.hp>0)
  dot(mx+o.x/W*mw,8+o.y/H*mh,o===me?4:o.ball?3:2,o===me?"white":o.ball?"orange":C[o.team]);
 $("hud").textContent=D[me.id][0]+" Lv."+me.lv+"｜"+
  (me.dead>0?"復活 "+Math.ceil(me.dead):"HP "+Math.ceil(me.hp)+"　氣 "+Math.floor(me.ki))+
  "｜擊倒 "+score.join(":")+"｜龍珠 "+balls.map(b=>b.hp).join(":");
 [...$("acts").children].forEach((b,k)=>{
  let name=["普攻 J","氣功 Q",D[me.id][7],D[me.id][8],"衝刺",D[me.id][9]][k],n=me.cd[k];
  b.textContent=name+(k===3&&me.lv<2?" Lv.2":k===5&&me.lv<3?" Lv.3":n>=1?" "+Math.ceil(n)+"秒":"");
  b.classList.toggle("down",held.has(b._pid)||keys.has(codes[k]))
 });
 if(state!=="play"){
  g.fillStyle="#0c172bd9";g.fillRect(0,h*.35,w,h*.28);
  txt(state==="pause"?"已暫停":state==="win"?"勝利！你的小隊取得龍珠":"敗北！敵隊取得龍珠",w/2,h*.49,24,"#ffe09a");
  txt(state==="pause"?"按 P 或點繼續":"點左上「選角」再戰",w/2,h*.55,15,"white")
 }
}

// 鍵盤與多指觸控
function down(k){if(state==="play")cast(me,k)}
codes.forEach((_,k)=>{
 let b=document.createElement("button");$("acts").append(b);
 b.onpointerdown=e=>{
  e.preventDefault();if(state!=="play")return;
  b.setPointerCapture(e.pointerId);b._pid=e.pointerId;held.set(e.pointerId,k);down(k)
 };
 b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>held.delete(e.pointerId)
});
onkeydown=e=>{
 if(state==="menu")return;
 if(e.code==="KeyP"&&!e.repeat){pause();return}
 if(state!=="play")return;
 if(codes.includes(e.code)||e.code.startsWith("Arrow"))e.preventDefault();
 keys.add(e.code);let k=codes.indexOf(e.code);if(k>=0&&!e.repeat)down(k)
};
onkeyup=e=>keys.delete(e.code);
const pad=$("pad");
function stick(e){
 let b=pad.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;
 let n=Math.max(32,Math.hypot(x,y));joy=[x/n,y/n];
 $("nub").style.transform="translate("+32*joy[0]+"px,"+32*joy[1]+"px)"
}
pad.onpointerdown=e=>{
 if(pid!=null||state!=="play")return;
 pid=e.pointerId;pad.setPointerCapture(pid);stick(e)
};
pad.onpointermove=e=>{if(e.pointerId===pid)stick(e)};
pad.onpointerup=pad.onpointercancel=pad.onlostpointercapture=e=>{
 if(pid===e.pointerId){pid=null;joy=[0,0];$("nub").style.transform=""}
};
onblur=()=>{if(state==="play")pause()};
document.onvisibilitychange=()=>{if(document.hidden&&state==="play")pause()};
requestAnimationFrame(frame);
</script></html>
